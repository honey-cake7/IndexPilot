[project]
name = "indexpilot"
version = "0.1.0"
description = "Explainable workload-aware PostgreSQL index recommendations"
requires-python = ">=3.12,<3.14"
dependencies = ["psycopg[binary]>=3.2,<4", "python-dotenv>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/indexpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"
markers = ["integration: requires the explicitly configured local PostgreSQL environment"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
